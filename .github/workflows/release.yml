name: Release

on:
    push:
        branches:
            - master

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    quality:
        uses: ./.github/workflows/quality.yml

    release:
        name: Release
        needs: quality
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

            - name: Install pnpm
              uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

            - name: Set up Node.js 24.19.0
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24.19.0"
                  package-manager-cache: false
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Create release pull request or publish
              uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  version-script: pnpm changeset:version
                  publish-script: pnpm release
