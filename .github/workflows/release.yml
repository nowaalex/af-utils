name: Release

on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    NX_PARALLEL: 100%

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: nx-cloud-protected
        env:
            NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_RW }}
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - name: Require scoped Nx Cloud token
              if: ${{ env.NX_CLOUD_ACCESS_TOKEN == '' }}
              run: exit 1

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

            - name: Install pnpm
              uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Create release pull request or publish
              uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  version-script: pnpm changeset:version
                  publish-script: pnpm release
