name: Release

on:
    push:
        branches:
            - master

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    id-token: write

env:
    CI: true

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js 24.19.0
              uses: actions/setup-node@v7
              with:
                  node-version: "24.19.0"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false

            - name: Install Dependencies
              run: pnpm i --frozen-lockfile

            - name: Check generated example files and dependencies
              run: pnpm nx run @af-utils/examples:versions:check

            - name: Check package READMEs
              run: pnpm nx run workspace:packages-readmes-check

            - name: Check Nx workspace contracts
              run: pnpm nx run workspace:nx-contracts-check

            - name: Check formatting and lint warnings
              run: pnpm nx run workspace:check-style

            - name: Typecheck
              run: pnpm nx run-many -t typecheck

            - name: Test packages and V8 optimization invariants
              run: pnpm nx run-many -t test

            - name: Build packages
              run: pnpm nx run-many -t build --projects=tag:npm:public

            - name: Validate package tarballs
              run: pnpm nx run-many -t publint --projects=tag:npm:public

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium firefox

            - name: Test examples in browser
              run: pnpm nx run @af-utils/examples:e2e

            - name: Check generated website files
              run: pnpm nx run workspace:website-generated-check

            - name: Upload Playwright artifacts
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Create Release Pull Request or Publish
              uses: changesets/action@v2
              with:
                  version-script: pnpm changeset:version
                  publish-script: pnpm release
