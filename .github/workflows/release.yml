name: Release

on:
    push:
        branches:
            - master

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    id-token: write

env:
    CI: true

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js 24.19.0
              uses: actions/setup-node@v7
              with:
                  node-version: "24.19.0"
                  package-manager-cache: false

            - name: Install Dependencies
              run: pnpm i --frozen-lockfile

            - name: Check generated example files and dependencies
              run: pnpm workspace:sync:check

            - name: Check package READMEs
              run: pnpm packages:readmes:check

            - name: Check formatting and lint warnings
              run: pnpm check:style

            - name: Typecheck
              run: pnpm typecheck

            - name: Test packages and V8 optimization invariants
              run: pnpm test

            - name: Build packages
              run: pnpm packages:build

            - name: Validate package tarballs
              run: pnpm publint

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium firefox

            - name: Test examples in browser
              run: pnpm test:e2e

            - name: Check generated website files
              run: pnpm website:generated:check

            - name: Upload Playwright artifacts
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Create Release Pull Request or Publish
              uses: changesets/action@v1
              with:
                  version: pnpm changeset:version
                  publish: pnpm release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
