name: CI

on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CI: true

jobs:
    check-hot-node-floor:
        name: check-hot Node 20.19 dependency floor
        runs-on: ubuntu-latest
        env:
            CHECK_HOT_REQUIRE_RUNTIMES: node
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js 20.19.0
              uses: actions/setup-node@v7
              with:
                  node-version: "20.19.0"
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build check-hot packages
              run: pnpm nx run-many -t build --projects=@af-utils/check-hot,@af-utils/check-hot-test-runners

            - name: Run Node floor oracle and ecosystem controls
              run: pnpm nx run-many -t test --projects=@af-utils/check-hot,@af-utils/check-hot-test-runners

            - name: Enforce check-hot mutation-test ratchet
              run: pnpm --filter @af-utils/check-hot test:mutation

    check-hot-runtimes:
        name: check-hot Node/Deno/Bun oracles
        runs-on: ubuntu-latest
        env:
            CHECK_HOT_REQUIRE_RUNTIMES: node,deno,bun
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js 24.19.0
              uses: actions/setup-node@v7
              with:
                  node-version: "24.19.0"
                  cache: "pnpm"

            - name: Setup Deno 2.x
              uses: denoland/setup-deno@v2
              with:
                  deno-version: "v2.9.5"

            - name: Setup Bun 1.3.14
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.14"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build check-hot packages
              run: pnpm nx run-many -t build --projects=@af-utils/check-hot,@af-utils/check-hot-test-runners

            - name: Run real runtime and ecosystem controls
              run: pnpm nx run-many -t test --projects=@af-utils/check-hot,@af-utils/check-hot-test-runners

    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js 24.19.0
              uses: actions/setup-node@v7
              with:
                  node-version: "24.19.0"
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Check generated example files and dependencies
              run: pnpm workspace:sync:check

            - name: Check package READMEs
              run: pnpm packages:readmes:check

            - name: Check formatting and lint warnings
              run: pnpm check:style

            - name: Typecheck
              run: pnpm typecheck

            - name: Test packages and V8 optimization invariants
              run: pnpm test

            - name: Build packages
              run: pnpm packages:build

            - name: Validate package tarballs
              run: pnpm publint

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium firefox

            - name: Test examples in browser
              run: pnpm test:e2e

            - name: Check generated website files
              run: pnpm website:generated:check

            - name: Upload Playwright artifacts
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7
